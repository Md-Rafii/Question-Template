<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Maker Pro - Final Fix</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --font-main: 'Nikosh', 'SolaimanLipi', 'Hind Siliguri', sans-serif;
            --primary: #1e3a8a;
            --accent: #f59e0b;
            --bg: #f8fafc;
            --border: #cbd5e1;
        }

        body { font-family: var(--font-main); background-color: var(--bg); margin: 0; padding: 10px; }
        .app-header { text-align: center; background: var(--primary); color: white; padding: 10px; border-radius: 8px 8px 0 0; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 20px; border-radius: 0 0 8px 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        .toolbar-box { background: #f1f5f9; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .input-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        input, select, textarea { padding: 8px; border: 1px solid var(--border); border-radius: 4px; font-family: var(--font-main); font-size: 14px; width: 100%; box-sizing: border-box; }

        .selection-row { display: flex; gap: 20px; background: #fffbeb; padding: 12px; border-radius: 6px; border: 1px solid #fef3c7; margin-bottom: 15px; align-items: center; }

        .tool-panel { background: #eff6ff; padding: 15px; border-radius: 8px; border: 1px solid #bfdbfe; display: flex; flex-direction: column; gap: 15px; }
        .tool-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
        .tool-group { display: flex; flex-direction: column; gap: 4px; }
        .tool-group label { font-size: 12px; font-weight: bold; color: #475569; }

        .editor-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .cq-box { background: #ffffff; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .editable-area { min-height: 120px; border: 1px solid var(--border); background: #fff; padding: 10px; border-radius: 4px; overflow-y: auto; font-size: 15px; outline: none; margin: 10px 0; }

        table { border-collapse: collapse; margin: 5px auto !important; width: auto; background: white; }
        table td { border: 1px solid black; padding: 2px 8px; text-align: center; min-width: 40px; }
        .table-label { font-weight: bold; font-size: 13px; display: block; margin-bottom: 2px; }
        .side-by-side { display: flex; justify-content: center; gap: 20px; margin: 5px 0; }
        .up-down { display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 5px 0; }
        .uddipok-img { max-width: 130px; height: auto; display: block; margin: 5px auto; }

        #result-container { padding: 40px 0; background: #64748b; margin-top: 40px; }
        .page { width: 297mm; height: 210mm; background: white; display: flex; position: relative; margin: 0 auto; box-sizing: border-box; overflow: hidden; }
        .column { width: 50%; padding: 5mm 12mm; box-sizing: border-box; height: 100%; }
        .cut-mark { position: absolute; left: 50%; top: 0; bottom: 0; border-left: 1px dashed #999; }
        
        .header { text-align: center; margin: 0; padding: 0; border-bottom: 1.5px solid #000; }
        .header h3 { margin: 0; padding-top: 2px; font-size: 19px; line-height: 1.1; }
        .header div { margin: 0; padding: 0; font-size: 13px; line-height: 1.2; }
        
        .info-bar { display: flex; justify-content: space-between; font-weight: bold; font-size: 13px; margin-top: 3px; margin-bottom: 5px; }
        .section-title { display: flex; justify-content: space-between; font-weight: bold; margin-top: 5px; font-size: 14px; border-bottom: 0.5px solid #ccc; }
        .cq-instruction { text-align: center; font-weight: bold; margin: 4px 0; font-size: 13px; text-decoration: underline; }
        .uddipok-text { line-height: 1.3; margin: 4px 0; font-size: 13.5px; }
        .q-line { display: flex; justify-content: space-between; font-size: 13.5px; margin-top: 1px; padding-left: 10px; }
        .q-mark { font-weight: normal; }

        .btn { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-preview { background: #334155; color: white; }
        .btn-pdf { background: #16a34a; color: white; }

        @media print { 
            @page { size: A4 landscape; margin: 0; }
            body { padding: 0; margin: 0; }
            .container, .app-header { display: none !important; } 
            #result-container { padding: 0; margin: 0; background: none; } 
            .page { border: none; margin: 0; box-shadow: none; } 
        }
    </style>
</head>
<body>

<header class="app-header"><h1>Question Maker Pro</h1></header>

<div class="container">
    <div class="toolbar-box">
        <div class="input-grid">
            <input id="school" placeholder="প্রতিষ্ঠানের নাম">
            <input id="exam" placeholder="পরীক্ষার নাম">
            <input id="subject" placeholder="বিষয়">
            <input id="class" placeholder="শ্রেণি">
            <input id="time" placeholder="সময়">
            <input id="marks" placeholder="পূর্ণমান">
        </div>

        <div class="selection-row">
            <div style="flex:1;">
                <label style="font-weight:bold;">সংক্ষিপ্ত প্রশ্ন উত্তর দিবে:</label>
                <input type="number" id="shortCountVal" value="10" style="width:60px; padding:4px;"> টি
            </div>
            <div style="flex:1;">
                <label style="font-weight:bold;">সৃজনশীল উত্তর দিবে:</label>
                <input type="number" id="cqCountVal" value="2" style="width:60px; padding:4px;"> টি
            </div>
        </div>
        <textarea id="shortQInput" style="height:60px; margin-bottom:15px;" placeholder="সংক্ষিপ্ত প্রশ্ন লিখুন (প্রতি লাইনে একটি করে)"></textarea>

        <div class="tool-panel">
            <div class="tool-row">
                <div class="tool-group"><label>ইমেজ যোগ করুন</label><input type="file" id="imgInput" accept="image/*"></div>
                <div class="tool-group">
                    <label>টার্গেট উদ্দীপক</label>
                    <select id="imgTargetSelect"><option value="uddipok1">সৃজনশীল ১</option><option value="uddipok2">সৃজনশীল ২</option></select>
                </div>
                <button class="btn" style="background:#8b5cf6; color:white;" onclick="uploadImage()">+ Add Image</button>
            </div>
            
            <div class="tool-row" style="border-top:1px dashed #ccc; padding-top:10px;">
                <div class="tool-group"><label>সারি</label><input type="number" id="rowNum" value="2" style="width:50px;"></div>
                <div class="tool-group"><label>কলাম</label><input type="number" id="colNum" value="2" style="width:50px;"></div>
                <div class="tool-group">
                    <label>লেআউট</label>
                    <select id="tableType">
                        <option value="single">একক টেবিল</option>
                        <option value="side">পাশাপাশি (টেবিল ক, খ)</option>
                        <option value="updown">উপর-নিচ (টেবিল ক, খ)</option>
                    </select>
                </div>
                <div class="tool-group">
                    <label>টার্গেট উদ্দীপক</label>
                    <select id="tableTargetSelect"><option value="uddipok1">সৃজনশীল ১</option><option value="uddipok2">সৃজনশীল ২</option></select>
                </div>
                <button class="btn" style="background:#f59e0b;" onclick="insertTable()">+ Add Table</button>
            </div>
        </div>
    </div>

    <div class="editor-container">
        <div class="cq-box">
            <label style="font-weight:bold; color:var(--primary);">সৃজনশীল ১</label>
            <div id="uddipok1" class="editable-area" contenteditable="true"></div>
            <div class="input-grid" style="grid-template-columns: 1fr 1fr;">
                <input id="c1q1" placeholder="ক) প্রশ্ন"> <input id="c1q2" placeholder="খ) প্রশ্ন">
                <input id="c1q3" placeholder="গ) প্রশ্ন"> <input id="c1q4" placeholder="ঘ) প্রশ্ন">
            </div>
        </div>
        <div class="cq-box">
            <label style="font-weight:bold; color:var(--primary);">সৃজনশীল ২</label>
            <div id="uddipok2" class="editable-area" contenteditable="true"></div>
            <div class="input-grid" style="grid-template-columns: 1fr 1fr;">
                <input id="c2q1" placeholder="ক) প্রশ্ন"> <input id="c2q2" placeholder="খ) প্রশ্ন">
                <input id="c2q3" placeholder="গ) প্রশ্ন"> <input id="c2q4" placeholder="ঘ) প্রশ্ন">
            </div>
        </div>
    </div>

    <div style="text-align:center; margin:25px;">
        <button class="btn btn-preview" onclick="generate()">Preview Question</button>
        <button class="btn btn-pdf" onclick="downloadPDF()">Download PDF</button>
    </div>
</div>

<div id="result-container"></div>

<script>
    const toBn = n => n.toString().replace(/\d/g, d => "০১২৩৪৫৬৭৮৯"[d]);
    const bLetters = ["ক)", "খ)", "গ)", "ঘ)", "ঙ)", "চ)", "ছ)", "জ)", "ঝ)", "ঞ)"];
    const cqMarks = [1, 2, 3, 4];

    function uploadImage() {
        const file = document.getElementById('imgInput').files[0];
        const targetId = document.getElementById('imgTargetSelect').value;
        if (file) {
            const reader = new FileReader();
            reader.onload = e => { document.getElementById(targetId).innerHTML += `<div style="text-align:center; margin:5px 0;"><img src="${e.target.result}" class="uddipok-img"></div>`; };
            reader.readAsDataURL(file);
        }
    }

    function generateTableHTML(r, c) {
        let table = '<table border="1">';
        for(let i=0; i<r; i++){
            table += '<tr>';
            for(let j=0; j<c; j++) table += '<td>...</td>';
            table += '</tr>';
        }
        table += '</table>';
        return table;
    }

    function insertTable() {
        const r = document.getElementById("rowNum").value;
        const c = document.getElementById("colNum").value;
        const type = document.getElementById("tableType").value;
        const targetId = document.getElementById("tableTargetSelect").value;
        
        let finalHtml = "";
        if(type === 'single') {
            finalHtml = `<div style="text-align:center; margin:5px 0;">${generateTableHTML(r,c)}</div>`;
        } else if(type === 'side') {
            finalHtml = `<div class="side-by-side">
                            <div style="text-align:center;"><span class="table-label">টেবিল ক</span>${generateTableHTML(r,c)}</div>
                            <div style="text-align:center;"><span class="table-label">টেবিল খ</span>${generateTableHTML(r,c)}</div>
                         </div>`;
        } else if(type === 'updown') {
            finalHtml = `<div class="up-down">
                            <div style="text-align:center;"><span class="table-label">টেবিল ক</span>${generateTableHTML(r,c)}</div>
                            <div style="text-align:center;"><span class="table-label">টেবিল খ</span>${generateTableHTML(r,c)}</div>
                         </div>`;
        }
        document.getElementById(targetId).innerHTML += finalHtml;
    }

    function generate() {
        const school = document.getElementById("school").value || "স্কুলের নাম";
        const exam = document.getElementById("exam").value || "পরীক্ষার নাম";
        const subject = document.getElementById("subject").value || "বিষয়";
        const cls = document.getElementById("class").value || "শ্রেণি";
        const time = document.getElementById("time").value || "";
        const marks = document.getElementById("marks").value || "০";

        const shortCount = document.getElementById("shortCountVal").value;
        const shortQs = document.getElementById("shortQInput").value.split('\n').filter(q => q.trim());
        let shortHtml = "";
        if(shortQs.length > 0) {
            shortHtml = `<div class="section-title"><span>১। সংক্ষিপ্ত প্রশ্নের উত্তর দাও (যেকোনো ${toBn(shortCount)}টি):</span><span>২ × ${toBn(shortCount)} = ${toBn(shortCount * 2)}</span></div>`;
            // সংক্ষিপ্ত প্রশ্নের নম্বর '২' বাদ দেওয়া হয়েছে
            shortQs.forEach((q, i) => { shortHtml += `<div class="q-line"><span>${bLetters[i] || (i+1)} ${q}</span></div>`; });
        }

        const getCQ = (id, prefix, num) => {
            const content = document.getElementById(id).innerHTML;
            const qs = [1,2,3,4].map(i => document.getElementById(`${prefix}q${i}`).value);
            if(!content.trim() && !qs[0]) return "";
            return `<div class="section-title"><span>${toBn(num)}। উদ্দীপকটি লক্ষ করো এবং উত্তর দাও:</span><span>১০</span></div>
                    <div class="uddipok-text">${content}</div>
                    ${qs.map((q, i) => q ? `<div class="q-line"><span>${bLetters[i]} ${q}</span><span class="q-mark">${toBn(cqMarks[i])}</span></div>` : '').join('')}`;
        };

        const cq1 = getCQ('uddipok1', 'c1', 2), cq2 = getCQ('uddipok2', 'c2', 3);
        const cqInstr = (cq1 || cq2) ? `<div class="cq-instruction">যেকোনো ${toBn(document.getElementById("cqCountVal").value)}টি সৃজনশীল প্রশ্নের উত্তর দাও</div>` : "";

        const fullContent = `
            <div class="header">
                <h3>${school}</h3>
                <div style="font-weight:bold;">${exam}</div>
                <div>বিষয়: ${subject} | শ্রেণি: ${cls}</div>
            </div>
            <div class="info-bar"><span>সময়: ${time}</span><span>পূর্ণমান: ${toBn(marks)}</span></div>
            ${shortHtml}${cqInstr}${cq1}${cq2}`;

        document.getElementById("result-container").innerHTML = `<div class="page" id="printable"><div class="column">${fullContent}</div><div class="cut-mark"></div><div class="column">${fullContent}</div></div>`;
        window.scrollTo({ top: document.getElementById("result-container").offsetTop, behavior: 'smooth' });
    }

    function downloadPDF() {
        const element = document.getElementById('printable');
        if(!element) return alert("প্রথমে Preview করুন!");
        html2pdf().set({ 
            margin: 0, 
            filename: 'Question.pdf', 
            html2canvas: { scale: 3 }, 
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' } 
        }).from(element).save();
    }
</script>
</body>
</html>
